<style>
:root{
  --navy-900:#08172e;
  --navy-800:#0a1d3a;
  --navy-700:#102b50;
  --navy-600:#173a68;
  --navy-500:#1f4a82;
  --gold:#c8a44d;
  --gold-bright:#e7cd86;
  --gold-deep:#a8862f;
  --cream:#f7f4ed;
  --paper:#ffffff;
  --ink:#16202f;
  --muted:#5d6878;
  --muted-light:#aeb9c9;
  --line-gold:rgba(200,164,77,.30);
  --shadow-lg:0 30px 70px -25px rgba(8,23,46,.55);
  --shadow-md:0 18px 40px -18px rgba(8,23,46,.40);
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:'Mulish', system-ui, -apple-system, sans-serif;
  --maxw:1240px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
ul{list-style:none}

h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.08;letter-spacing:.005em}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px}
.eyebrow{
  font-family:var(--sans);
  font-weight:700;font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--gold-deep);display:inline-flex;align-items:center;gap:10px;
}
.eyebrow::before{content:"";width:30px;height:1px;background:var(--gold)}
.eyebrow.center::after{content:"";width:30px;height:1px;background:var(--gold)}
.eyebrow.center{justify-content:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--sans);font-weight:700;font-size:.92rem;letter-spacing:.02em;
  padding:14px 26px;border-radius:10px;cursor:pointer;border:1.5px solid transparent;
  transition:transform .2s ease, box-shadow .25s ease, background .25s ease, color .25s ease;
  white-space:nowrap;
}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{transform:translateY(-2px)}
.btn-gold{background:linear-gradient(135deg,var(--gold-bright),var(--gold) 55%,var(--gold-deep));color:#2a1f06;box-shadow:0 10px 26px -10px rgba(200,164,77,.7)}
.btn-gold:hover{box-shadow:0 16px 34px -10px rgba(200,164,77,.85)}
.btn-wa{background:#1faa54;color:#fff;box-shadow:0 10px 26px -10px rgba(31,170,84,.7)}
.btn-wa:hover{background:#1c9c4d}
.btn-outline{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
.btn-outline:hover{border-color:var(--gold);color:var(--gold-bright);background:rgba(200,164,77,.06)}
.btn-ghost-navy{background:transparent;border-color:rgba(16,43,80,.25);color:var(--navy-700)}
.btn-ghost-navy:hover{border-color:var(--gold);color:var(--gold-deep);background:rgba(200,164,77,.07)}

/* ============ HEADER ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:60;
  background:linear-gradient(180deg,rgba(8,23,46,.96),rgba(8,23,46,.86));
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(200,164,77,.18);
  transition:padding .3s ease, background .3s ease;
}
.topbar.scrolled{background:rgba(8,23,46,.98);box-shadow:0 10px 30px -15px rgba(0,0,0,.6)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;transition:padding .3s ease}
.topbar.scrolled .nav{padding:9px 0}

.brand{display:flex;align-items:center;gap:14px;flex:none}
.brand .logo{width:54px;height:54px;flex:none;transition:width .3s ease,height .3s ease}
.topbar.scrolled .brand .logo{width:46px;height:46px}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-text .small{font-family:var(--sans);font-weight:700;letter-spacing:.34em;font-size:.6rem;color:var(--muted-light);text-transform:uppercase}
.brand-text .name{font-family:var(--serif);font-weight:700;font-size:1.5rem;color:#fff;letter-spacing:.04em;margin:1px 0}
.brand-text .tag{font-family:var(--serif);font-style:italic;font-size:.78rem;color:var(--gold-bright);letter-spacing:.02em}

.menu{display:flex;align-items:center;gap:30px}
.menu a{font-weight:600;font-size:.82rem;letter-spacing:.13em;text-transform:uppercase;color:#dfe5ee;position:relative;padding:6px 0}
.menu a::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--gold);transition:width .25s ease}
.menu a:hover{color:#fff}
.menu a:hover::after,.menu a.active::after{width:100%}

.nav-actions{display:flex;align-items:center;gap:12px;flex:none}
.phone-chip{display:flex;align-items:center;gap:10px;border:1.5px solid rgba(200,164,77,.55);border-radius:40px;padding:8px 18px;color:#fff;font-weight:700;font-size:.95rem;letter-spacing:.03em;transition:.25s}
.phone-chip svg{width:16px;height:16px;color:var(--gold-bright)}
.phone-chip:hover{background:rgba(200,164,77,.12);border-color:var(--gold)}
.wa-chip{width:46px;height:46px;border-radius:11px;background:#1faa54;display:grid;place-items:center;flex:none;transition:.2s;box-shadow:0 8px 20px -8px rgba(31,170,84,.7)}
.wa-chip svg{width:24px;height:24px;color:#fff}
.wa-chip:hover{transform:translateY(-2px);background:#1c9c4d}

.burger{display:none;flex-direction:column;gap:5px;width:46px;height:46px;border:1.5px solid rgba(255,255,255,.25);border-radius:10px;background:transparent;cursor:pointer;align-items:center;justify-content:center}
.burger span{width:22px;height:2px;background:#fff;border-radius:2px;transition:.3s}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* mobile drawer */
.drawer{position:fixed;inset:0 0 0 auto;width:min(86%,360px);background:var(--navy-800);z-index:70;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);padding:90px 30px 40px;display:flex;flex-direction:column;gap:6px;box-shadow:-30px 0 60px -20px rgba(0,0,0,.6);border-left:1px solid rgba(200,164,77,.2)}
.drawer.open{transform:translateX(0)}
.drawer a.dlink{font-family:var(--serif);font-size:1.45rem;color:#eef2f8;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08);letter-spacing:.02em}
.drawer a.dlink:hover{color:var(--gold-bright);padding-left:8px;transition:.2s}
.drawer .drawer-cta{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.scrim{position:fixed;inset:0;background:rgba(4,10,22,.55);backdrop-filter:blur(2px);z-index:65;opacity:0;visibility:hidden;transition:.3s}
.scrim.show{opacity:1;visibility:visible}

/* ============ HERO ============ */
.hero{position:relative;background:var(--navy-800);color:#fff;padding:128px 0 0;overflow:hidden}
.hero::before{content:"";position:absolute;top:-15%;right:-10%;width:60%;height:80%;background:radial-gradient(circle,rgba(200,164,77,.16),transparent 65%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background:
   linear-gradient(115deg,var(--navy-900) 0%,var(--navy-800) 45%,var(--navy-700) 100%);z-index:0}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr .95fr;gap:54px;align-items:center;padding-bottom:60px}
.hero-copy{max-width:600px}
.hero h1{font-size:clamp(2.7rem,5.6vw,4.6rem);margin:18px 0 6px}
.hero h1 .gold{color:var(--gold-bright);display:block}
.hero h1 .white{color:#fff;display:block}
.hero .lead{font-size:1.18rem;color:#cfd7e3;max-width:480px;margin:18px 0 28px;font-weight:300;line-height:1.7}
.gold-rule{width:64px;height:3px;background:linear-gradient(90deg,var(--gold-bright),transparent);border-radius:3px;margin:22px 0}

.features{display:flex;gap:30px;flex-wrap:wrap;margin:26px 0 34px}
.feature{display:flex;align-items:center;gap:13px}
.feature .ic{width:46px;height:46px;border:1.5px solid var(--line-gold);border-radius:12px;display:grid;place-items:center;color:var(--gold-bright);flex:none}
.feature .ic svg{width:23px;height:23px}
.feature b{display:block;font-family:var(--sans);font-weight:800;font-size:.86rem;letter-spacing:.1em;text-transform:uppercase;color:#fff}
.feature span{font-size:.82rem;color:var(--muted-light)}

.hero-cta{display:flex;flex-wrap:wrap;gap:13px}

/* hero image frame (placeholder ready for real photo) */
.hero-figure{position:relative}
.frame{position:relative;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid rgba(200,164,77,.35)}
.frame::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.12);border-radius:16px;pointer-events:none}
.corner{position:absolute;width:30px;height:30px;border:2px solid var(--gold);z-index:3}
.corner.tl{top:12px;left:12px;border-right:0;border-bottom:0}
.corner.tr{top:12px;right:12px;border-left:0;border-bottom:0}
.corner.bl{bottom:12px;left:12px;border-right:0;border-top:0}
.corner.br{bottom:12px;right:12px;border-left:0;border-top:0}

.photo{
  aspect-ratio:4/3.05;width:100%;
  background:
    radial-gradient(circle at 70% 20%, rgba(231,205,134,.10), transparent 50%),
    linear-gradient(160deg,#13294b,#0b1c36 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  color:rgba(231,205,134,.85);text-align:center;padding:30px;position:relative;
}
.photo .ph-icon{width:74px;height:74px;opacity:.55}
.photo .ph-label{font-family:var(--sans);font-weight:700;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(231,205,134,.9)}
.photo .ph-sub{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:rgba(207,215,227,.75)}

.badge-years{position:absolute;left:-22px;bottom:32px;background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));color:#241a04;border-radius:14px;padding:14px 20px;text-align:center;box-shadow:var(--shadow-md);z-index:4}
.badge-years b{font-family:var(--serif);font-weight:700;font-size:2.1rem;display:block;line-height:1}
.badge-years span{font-family:var(--sans);font-weight:700;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase}

/* hero bottom strip: trust band */
.trust-strip{position:relative;z-index:2;background:rgba(8,23,46,.6);border-top:1px solid rgba(200,164,77,.18)}
.trust-strip .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:24px;padding-bottom:24px}
.tcell{display:flex;align-items:center;gap:13px;justify-content:center;border-right:1px solid rgba(255,255,255,.08)}
.tcell:last-child{border-right:0}
.tcell .ic{width:40px;height:40px;color:var(--gold-bright)}
.tcell .ic svg{width:34px;height:34px}
.tcell b{font-family:var(--sans);font-weight:800;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#fff;display:block}
.tcell span{font-size:.74rem;color:var(--muted-light)}

/* ============ DOCTOR ============ */
.doctor{background:linear-gradient(160deg,var(--navy-900),var(--navy-700));color:#fff;padding:96px 0;position:relative;overflow:hidden}
.doctor::before{content:"";position:absolute;bottom:-20%;left:-8%;width:45%;height:80%;background:radial-gradient(circle,rgba(200,164,77,.10),transparent 60%)}
.doctor-grid{position:relative;display:grid;grid-template-columns:.85fr 1.15fr;gap:56px;align-items:center}
.doc-figure .photo{aspect-ratio:3/3.4}
.doc-figure .photo .ph-icon{width:64px;height:64px}
.doc-info h2{font-size:clamp(2.2rem,4vw,3.2rem);color:#fff;margin:14px 0 4px}
.doc-info h2 .gold{color:var(--gold-bright)}
.doc-exp{font-family:var(--serif);font-style:italic;font-size:1.4rem;color:var(--gold-bright);margin:6px 0 14px}
.doc-info p{color:#cfd7e3;font-weight:300;max-width:520px;font-size:1.05rem;margin-bottom:30px}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:560px}
.pillar{text-align:center}
.pillar .ic{width:58px;height:58px;margin:0 auto 12px;border:1.5px solid var(--line-gold);border-radius:50%;display:grid;place-items:center;color:var(--gold-bright)}
.pillar .ic svg{width:27px;height:27px}
.pillar b{font-family:var(--sans);font-weight:800;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;line-height:1.3;color:#eef2f8;display:block}

/* ============ SPECIALTIES ============ */
.specs{background:var(--cream);padding:96px 0;position:relative}
.specs .head{text-align:center;max-width:680px;margin:0 auto 56px}
.specs h2{font-size:clamp(2.1rem,3.8vw,3rem);color:var(--navy-800);margin:14px 0 16px}
.specs h2 .gold{color:var(--gold-deep)}
.specs .head p{color:var(--muted);font-size:1.08rem;font-weight:300}
.spec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 28px;max-width:860px;margin:0 auto}
.spec-item{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid rgba(16,43,80,.07);border-left:3px solid var(--gold);border-radius:10px;padding:16px 20px;box-shadow:0 8px 22px -16px rgba(8,23,46,.4);transition:.25s}
.spec-item:hover{transform:translateX(4px);border-left-color:var(--gold-deep);box-shadow:0 14px 30px -16px rgba(8,23,46,.5)}
.spec-item .chk{width:26px;height:26px;border-radius:50%;background:var(--navy-800);color:var(--gold-bright);display:grid;place-items:center;flex:none}
.spec-item .chk svg{width:14px;height:14px}
.spec-item span{font-weight:600;color:var(--ink);font-size:1rem}

/* ============ FACILITIES ============ */
.facilities{background:var(--paper);padding:96px 0}
.facilities .head{text-align:center;max-width:680px;margin:0 auto 54px}
.facilities h2{font-size:clamp(2.1rem,3.8vw,3rem);color:var(--navy-800);margin:14px 0 16px}
.facilities .head p{color:var(--muted);font-size:1.08rem;font-weight:300}
.fac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.fac-card{border-radius:14px;overflow:hidden;border:1px solid rgba(16,43,80,.08);box-shadow:0 14px 34px -22px rgba(8,23,46,.4);background:#fff;transition:.3s}
.fac-card:hover{transform:translateY(-6px);box-shadow:0 24px 44px -22px rgba(8,23,46,.55)}
.fac-photo{aspect-ratio:4/3;background:#0c1d37;position:relative;overflow:hidden}
.fac-photo img{width:100%;height:100%;object-fit:cover;display:block}
.fac-note{text-align:center;max-width:640px;margin:26px auto 0;color:var(--navy-500);font-size:.95rem}
.fac-note strong{color:var(--navy-700);font-weight:700}
.fac-photo svg{width:46px;height:46px;opacity:.6}
.fac-photo .mini{font-family:var(--serif);font-style:italic;font-size:.82rem;color:rgba(207,215,227,.6)}
.fac-card .label{padding:16px 10px;text-align:center;background:#fff}
.fac-card .label b{font-family:var(--sans);font-weight:800;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--navy-700)}

/* real photos inside frames */
.frame > img{width:100%;display:block;object-fit:cover}
.hero-figure .frame > img{aspect-ratio:4/3.05}
.doc-figure .frame > img{aspect-ratio:3/3.4;object-position:52% 38%}

/* featured real photo in facilities */
.fac-feature{position:relative;max-width:780px;margin:0 auto 38px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-md);border:1px solid rgba(16,43,80,.12)}
.fac-feature img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover}
.fac-feature .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 22px 16px;background:linear-gradient(transparent,rgba(8,23,46,.9));color:#fff}
.fac-feature .cap b{font-family:var(--serif);font-size:1.35rem;display:block;line-height:1.2}
.fac-feature .cap span{font-size:.85rem;color:#cfd7e3}

/* ============ CASES (checklist del folleto) ============ */
.cases{background:linear-gradient(160deg,var(--navy-800),var(--navy-900));color:#fff;padding:92px 0;position:relative;overflow:hidden}
.cases::before{content:"";position:absolute;top:-15%;right:-8%;width:45%;height:70%;background:radial-gradient(circle,rgba(200,164,77,.10),transparent 60%)}
.cases .wrap{position:relative}
.cases .head{text-align:center;max-width:760px;margin:0 auto 50px}
.cases h2{font-size:clamp(2rem,3.7vw,2.9rem);color:#fff;margin:14px 0 14px}
.cases h2 .gold{color:var(--gold-bright)}
.cases .head p{color:#cfd7e3;font-weight:300;font-size:1.06rem}
.case-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 26px;max-width:940px;margin:0 auto 44px}
.case-item{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;background:rgba(255,255,255,.04);border:1px solid rgba(200,164,77,.18);border-radius:12px;transition:.25s}
.case-item:hover{background:rgba(200,164,77,.08);border-color:var(--line-gold);transform:translateY(-2px)}
.case-item .q{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));color:#241a04;display:grid;place-items:center;flex:none;font-family:var(--serif);font-weight:700;font-size:1.05rem;margin-top:1px}
.case-item p{font-size:.98rem;color:#e7ecf3;font-weight:300;line-height:1.55}
.cases .case-cta{text-align:center}
.cases .case-cta .note{font-family:
